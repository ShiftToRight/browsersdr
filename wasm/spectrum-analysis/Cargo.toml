[package]
name = "browsersdr-spectrum-wasm"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
rustfft = { version = "=6.4.1", default-features = false, features = ["wasm_simd"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
