name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check public source boundary
        run: node scripts/check-public-source.mjs

      - name: Use Node.js 22.23.1
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check infrastructure formatting
        run: npm run format:check

      - name: Validate checked-in WASM
        run: npm run test:wasm

      - name: Test optional diagnostics collector
        run: npm run test:report-service

      - name: Run unit and integration tests
        run: npm test -- --reporter=verbose

      - name: Build production bundle
        run: npm run build

      - name: Check initial JavaScript and map byte budgets
        run: npm run performance:check

      - name: Verify static SEO documents and discovery files
        run: node scripts/verify-seo.mjs dist

  browser:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        project: [chromium-dev, chromium-production]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 22.23.1
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install Chromium for browser integration tests
        run: npx playwright install --with-deps chromium

      - name: Run browser integration tests
        run: npm run test:e2e -- --project=${{ matrix.project }}

      - name: Upload browser failure artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.project }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
