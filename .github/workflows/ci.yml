name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 22.23.1
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check infrastructure formatting
        run: npm run format:check

      - name: Validate checked-in WASM
        run: npm run test:wasm

      - name: Run unit and integration tests
        run: npm test -- --reporter=verbose

      - name: Build production bundle
        run: npm run build

      - name: Install Chromium for browser integration tests
        run: npx playwright install --with-deps chromium

      - name: Run development and production browser integration tests
        run: npm run test:e2e

      - name: Upload browser failure artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
